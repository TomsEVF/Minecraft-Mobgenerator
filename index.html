<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Tools · Loot-Tables & Mob-Generator</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-icon" id="brand-icon"></span>
            <div>
                <h1>Minecraft<span>Tools</span></h1>
                <div class="brand-sub" id="brand-sub"></div>
            </div>
        </div>
        <nav class="tabs" role="tablist">
            <button class="tab" role="tab" data-view="loot" id="tab-loot"><span class="tab-icon" id="tab-icon-loot"></span>Loot-Tables</button>
            <button class="tab" role="tab" data-view="mob" id="tab-mob"><span class="tab-icon" id="tab-icon-mob"></span>Mob-Generator</button>
        </nav>
        <div class="top-actions">
            <button class="btn btn-guide" id="btn-guide" title="Schritt-für-Schritt-Anleitung öffnen">📖 Anleitung</button>
            <span class="check-wrap explain-switch" id="explain-wrap">
                <label class="check" title="Kurze Erklärtexte in der Oberfläche ein- oder ausblenden"><input type="checkbox" id="explain-toggle" checked> Erklärungen</label>
            </span>
            <label class="fmt-select" title="Deine Minecraft-Version – gilt für beide Bereiche">
                <span>Version</span>
                <select id="version"></select>
            </label>
        </div>
    </header>

    <!-- ============ Loot-Tables ============ -->
    <section class="view" id="view-loot">
        <div class="toolbar">
            <div class="toolbar-title">Loot-Table bauen</div>
            <div class="toolbar-actions">
                <button class="btn" id="btn-new" title="Neue, leere Loot-Table beginnen">Neu</button>
                <button class="btn" id="btn-load" title="Gespeichertes Projekt öffnen">Projekt laden</button>
                <button class="btn" id="btn-save" title="Projekt zum späteren Weiterbearbeiten speichern">Projekt speichern</button>
                <input type="file" id="file-load" accept=".json,application/json" hidden>
                <button class="btn btn-accent" id="btn-sim" title="Loot testweise auswürfeln">Testwurf</button>
                <button class="btn btn-primary" id="btn-download">JSON herunterladen</button>
            </div>
        </div>
        <main class="layout">
            <aside class="panel settings" id="settings"></aside>

            <section class="pools-area">
                <div id="pools"></div>
                <button class="add-pool" id="btn-add-pool">+ Pool hinzufügen</button>
            </section>

            <aside class="panel output loot-output">
                <div class="output-head">
                    <h2>Ausgabe</h2>
                    <div class="output-actions">
                        <button class="btn btn-small" id="btn-copy">Kopieren</button>
                    </div>
                </div>
                <div class="out-path" id="out-path"></div>
                <ul class="warnings" id="warnings"></ul>
                <pre class="json" id="json"></pre>
            </aside>
        </main>
    </section>

    <!-- ============ Mob-Generator ============ -->
    <section class="view" id="view-mob" hidden>
        <div class="toolbar">
            <div class="toolbar-title">Mob erstellen</div>
            <div class="toolbar-actions">
                <button class="btn" id="mob-new" title="Alle Einstellungen dieses Mobs zurücksetzen">Neu</button>
                <button class="btn" id="mob-load" title="Gespeicherten Mob öffnen">Mob laden</button>
                <button class="btn" id="mob-save" title="Mob als Datei speichern">Mob speichern</button>
                <input type="file" id="mob-file" accept=".json,application/json" hidden>
                <button class="btn btn-primary" id="mob-copy">Befehl kopieren</button>
            </div>
        </div>
        <main class="layout mob-layout">
            <aside class="panel mob-list" id="mob-list"></aside>
            <section class="mob-editor" id="mob-editor"></section>
            <aside class="panel output mob-output" id="mob-output"></aside>
        </main>
    </section>

    <div id="modal-root"></div>
    <div class="toast" id="toast"></div>

    <script src="js/mcdata.js"></script>
    <script src="js/mobdata.js"></script>
    <script src="js/export.js"></script>
    <script src="js/help.js"></script>
    <script src="js/app.js"></script>
    <script src="js/mob.js"></script>
</body>
</html>
